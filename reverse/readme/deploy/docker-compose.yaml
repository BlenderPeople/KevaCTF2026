services:
  readme:
    image: ubuntu:latest
    platform: linux/amd64
    container_name: readme
    ports:
      - "41557:41557"
    environment:
      - FLAG=kevactf{w0w_y0u_c4n_c0unt}
    volumes:
      - ../src/readme:/readme:ro
    command: ["/bin/bash", "-c", "apt update && apt install -y socat && socat TCP-LISTEN:41557,fork,reuseaddr TCP:127.0.0.1:41557"]
    restart: unless-stopped
    mem_limit: 256M
    mem_reservation: 128M
    cpus: '0.5'