{% extends "base.html" %}
{% block content %}
<div class="auth-form-centered">
    <div class="auth-form">
        <h2>Вход в научный центр «Эхо-7»</h2>
    
    <div class="error" id="formError" style="display: none;"></div>
    
    <form method="POST" action="/login" id="loginForm">
        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Логин" required minlength="8" maxlength="30" autocomplete="off">
            <div class="validation-messages" id="usernameErrors"></div>
        </div>
        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Пароль" required minlength="8" maxlength="50">
            <div class="validation-messages" id="passwordErrors"></div>
        </div>
        <button type="submit" id="submitBtn">Войти в центр</button>
    </form>
    <p>Нет профиля? <a href="/register">Создать учётную запись исследователя</a></p>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const usernameErrors = document.getElementById('usernameErrors');
    const passwordErrors = document.getElementById('passwordErrors');
    const formError = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');

    const allowedPattern = /^[^ \u0400-\u04FF\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]+$/u;
    const emojiPattern = /[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F1E0}-\u{1F1FF}]/u;

    function clearFormError() {
        if (formError.style.display === 'block') {
            formError.style.display = 'none';
            formError.textContent = '';
            usernameInput.classList.remove('invalid');
            passwordInput.classList.remove('invalid');
        }
    }

    function validateField(value, min, max, errorsEl, inputEl) {
        const errors = [];

        if (!value || value.trim() === '') {
            errors.push(`Поле обязательно для заполнения`);
        } else {
            if (value.includes(' ')) errors.push('Без пробелов');
            if (/[\u0400-\u04FF]/.test(value)) errors.push('Без кириллицы');
            if (emojiPattern.test(value)) errors.push('Без смайликов');
            if (value.length < min || value.length > max) errors.push(`${min}–${max} символов`);
            if (!allowedPattern.test(value)) errors.push('Латиница, цифры, спецсимволы');
        }
        
        if (errors.length === 0) {
            errorsEl.innerHTML = '';
            errorsEl.classList.remove('show');
            inputEl.classList.remove('invalid');
            if (value.length > 0) inputEl.classList.add('valid');
            else inputEl.classList.remove('valid');
            return true;
        } else {
            errorsEl.innerHTML = errors.map(e => `<span class="validation-message">${e}</span>`).join('');
            errorsEl.classList.add('show');
            inputEl.classList.add('invalid');
            inputEl.classList.remove('valid');
            return false;
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const u = validateField(usernameInput.value, 8, 30, usernameErrors, usernameInput);
        const p = validateField(passwordInput.value, 8, 50, passwordErrors, passwordInput);
        if (!u || !p) return;

        formError.style.display = 'none';
        formError.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Вход...';

        const formData = new FormData(this);

        try {
            const response = await fetch('/login', {
                method: 'POST',
                body: formData,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            const contentType = response.headers.get("content-type");
            let result;
            if (contentType && contentType.includes("application/json")) {
                result = await response.json();
            } else {
                result = await response.text();
            }

            if (response.ok) {
                if (typeof result === 'object' && result.access_token) {
                    localStorage.setItem('access_token', result.access_token);
                }
                window.location.href = '/agency';
            } else {
                let errorMsg = "Произошла непредвиденная ошибка";

                const typeError = response.headers.get('type-error');

                if (typeError === 'password') {
                    errorMsg = "Пароль неверный";
                } else if (response.status === 404) {
                    errorMsg = "Пользователь не найден";
                } else if (response.status === 401) {
                    errorMsg = "Пароль неверный";
                }

                formError.textContent = errorMsg;
                formError.style.display = 'block';
                passwordInput.classList.add('invalid');
            }
        } catch (err) {
            formError.textContent = "Ошибка соединения с сервером";
            formError.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Войти в центр';
        }
    });

    usernameInput.addEventListener('input', () => {
        clearFormError();
        validateField(usernameInput.value, 8, 30, usernameErrors, usernameInput);
    });

    passwordInput.addEventListener('input', () => {
        clearFormError();
        validateField(passwordInput.value, 8, 50, passwordErrors, passwordInput);
    });
</script>
{% endblock %}
